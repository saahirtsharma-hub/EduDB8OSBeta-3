<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shell</title>
<style>
:root{--g:linear-gradient(90deg,#ff0f1f 0%,#2323ff 35%,#7f25ff 70%,#845040 100%);--red:#ff3338}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans",system-ui,sans-serif;color:#fff}
body{background:var(--g)}
#lock,#desk{position:absolute;inset:0}#desk{display:none}
body.in #lock{display:none}body.in #desk{display:block}
#clock{position:absolute;top:9vh;width:100%;text-align:center;font-weight:800;font-size:min(20vw,190px);line-height:1;color:var(--red)}
#who{position:absolute;top:40vh;width:100%;text-align:center;font-weight:800;font-size:min(9vw,72px);background:linear-gradient(90deg,#1fa3c5,#6ccb5f);-webkit-background-clip:text;background-clip:text;color:transparent}
#pw{position:absolute;top:56vh;left:50%;transform:translateX(-50%);width:min(70vw,420px);height:64px;border:0;border-radius:16px;background:var(--g);color:#fff;font:400 1.4rem "Noto Sans",sans-serif;text-align:center;cursor:pointer}
#pw::placeholder{color:#fffa}
#apps{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);width:100px;height:112px;border:0;border-radius:18px;background:var(--red);font:400 1.15rem/1.35 "Noto Sans",sans-serif;cursor:pointer;background-clip:padding-box}
#apps b{font-weight:400;background:var(--g) fixed;-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{position:absolute;left:50%;bottom:262px;transform:translateX(-50%);width:min(450px,92vw);max-height:calc(100vh - 300px);overflow:auto;background:var(--red);border-radius:18px;padding:26px 22px;display:none}
.panel.on{display:block}
.row{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:14px}
.tile{border:0;border-radius:22%;background:#000;color:#fff;font:700 1.5rem "Noto Sans",sans-serif;display:grid;place-items:center;cursor:pointer;transition:width .15s,height .15s}
.tile:hover,.tile:focus-visible{width:83px!important;height:109px!important}
#sq{width:100%;padding:12px 14px;border:0;border-radius:12px;font:inherit;background:#000;color:#fff}
.pk{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0007;border-radius:12px;padding:10px 12px;margin-top:8px}
.pk small{opacity:.8}.pk button{border:0;border-radius:8px;padding:6px 14px;background:#fff;color:#000;font-weight:600;cursor:pointer}
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:8px 12px;border-radius:22px;background:#140f2899;backdrop-filter:blur(14px);z-index:5;max-width:98vw}
.ic{position:relative;flex:none;width:50px;height:50px;border:0;border-radius:13px;color:#fff;font:700 1.15rem "Noto Sans",sans-serif;cursor:pointer;transform-origin:bottom center;transition:transform .08s}
.ic span{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:#3b1a6b;padding:4px 10px;border-radius:8px;font:500 .85rem "Noto Sans",sans-serif;white-space:nowrap;display:none}
.ic:hover span{display:block}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style></head>
<body>
<section id="lock"><div id="clock"></div><div id="who">Saahir</div><button id="pw">Enter Password</button></section>
<section id="desk">
  <div id="drawer" class="panel" aria-label="Apps"></div>
  <div id="store" class="panel" aria-label="App Store"><input id="sq" placeholder="Search .deb apps (vlc, gimp, libreoffice) and press Enter"><div id="sr"></div></div>
  <button id="apps"><b>APPS<br>Click<br>Here</b></button>
</section>
<nav id="dock" aria-label="Dock"></nav>
<script>
const T="__TOKEN__",$=s=>document.querySelector(s);
const api=(p,b={})=>fetch(p,{method:"POST",headers:{"X-Token":T,"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* name, target (url | firefox | foot | store), color, glyph */
const DOCK=[["Firefox","firefox","#e66000","F"],["Terminal","foot","#1c1c24",">_"],["Claude","https://claude.ai","#d97757","C"],
["Google","https://www.google.com","#4285f4","G"],["GitHub","https://github.com","#171515","GH"],["Gmail","https://mail.google.com","#ea4335","M"],
["OneDrive","https://onedrive.live.com","#0f6cbd","O"],["Word","https://word.cloud.microsoft","#185abd","W"],["Excel","https://excel.cloud.microsoft","#107c41","X"],
["PowerPoint","https://powerpoint.cloud.microsoft","#c43e1c","P"],["OneNote","https://onenote.cloud.microsoft","#7719aa","N"],
["Outlook","https://outlook.cloud.microsoft","#0a64ad","Ou"],["Teams","https://teams.cloud.microsoft","#5b5fc7","T"],["Roblox","https://www.roblox.com","#2b2b2b","R"],
["Gemini","https://gemini.google.com","#6b7cf0","✦"],["YouTube","https://www.youtube.com","#ff0033","▶"],["My Webapps","http://store.app.local/","#0f7b7d","▦"],["App Store","store","#1b8cf0","A"]];
const dock=$("#dock");
dock.innerHTML=DOCK.map((d,i)=>`<button class="ic" data-i="${i}" style="background:${d[2]}"><span>${d[0]}</span>${d[3]}</button>`).join("");
dock.onclick=e=>{const b=e.target.closest(".ic");if(!b)return;const t=DOCK[b.dataset.i][1];
  if(t==="store")return toggle("store");
  api("/api/launch",t==="foot"?{cmd:"foot"}:{url:t==="firefox"?"":t}).catch(()=>{})};
dock.onmousemove=e=>{const x=e.clientX-dock.getBoundingClientRect().left;
  for(const b of dock.children){const d=Math.abs(x-(b.offsetLeft+b.offsetWidth/2));b.style.transform=`scale(${1+.9*Math.exp(-((d/85)**2))})`}};
dock.onmouseleave=()=>{for(const b of dock.children)b.style.transform=""};

const tick=()=>{const d=new Date();$("#clock").textContent=(d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0")};tick();setInterval(tick,10000);
const unlock=()=>{document.body.classList.add("in");loadApps()};
$("#pw").onclick=()=>{const i=document.createElement("input");i.type="password";i.id="pw";i.placeholder="Password";$("#pw").replaceWith(i);i.focus();
  i.onkeydown=e=>{if(e.key==="Enter")unlock()}};

const SC=[1,1,.87,.87,.6,.6,.36,.36];   /* tile size shrinks down the drawer, like your mockup */
function drawer(list){const D=$("#drawer");D.innerHTML="";
  for(let i=0,r=0;i<list.length;i+=4,r++){const s=SC[Math.min(r,7)],row=document.createElement("div");row.className="row";
    list.slice(i,i+4).forEach(a=>{const b=document.createElement("button");b.className="tile";b.title=a.name;b.textContent=a.name[0];
      b.style.cssText=`width:${83*s}px;height:${109*s}px`;b.onclick=()=>api("/api/launch",{id:a.id}).catch(()=>{});row.append(b)});D.append(row)}}
const loadApps=()=>api("/api/apps").then(drawer).catch(()=>drawer(DOCK.map(d=>({name:d[0]}))));
let upd=0;
function toggle(id){for(const p of document.querySelectorAll(".panel"))if(p.id!==id)p.classList.remove("on");$("#"+id).classList.toggle("on");
  if(id==="store"&&!upd){upd=1;$("#sr").textContent="Updating package lists…";api("/api/refresh").then(()=>$("#sr").textContent="Type a name and press Enter.").catch(()=>$("#sr").textContent="Package lists could not be updated.")}}
$("#apps").onclick=()=>toggle("drawer");
document.onkeydown=e=>{if(e.key==="Escape")for(const p of document.querySelectorAll(".panel"))p.classList.remove("on")};

$("#sq").onkeydown=async e=>{if(e.key!=="Enter")return;const r=await api("/api/search",{q:e.target.value}).catch(()=>[]);
  $("#sr").innerHTML=Array.isArray(r)&&r.length?r.map(p=>`<div class="pk"><div><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small></div><button data-p="${esc(p.name)}">Install</button></div>`).join(""):"No packages found."};
$("#sr").onclick=async e=>{const p=e.target.dataset.p;if(!p)return;e.target.textContent="Installing…";e.target.disabled=true;
  const r=await api("/api/install",{pkg:p}).catch(()=>({ok:false}));e.target.textContent=r.ok?"Installed":"Failed";if(r.ok)loadApps()};
</script></body></html>
